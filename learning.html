<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprantisaj — OSLIFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
:root{
  --bg:#0B0F1A; --bg-elevated:#10141F; --surface:#141926; --surface-2:#1A2030;
  --border:#232A3B; --border-soft:#1B2130;
  --text:#EDEFF5; --text-dim:#9AA3B8; --text-faint:#5C6478;
  --blue:#3E7BFA; --blue-soft:rgba(62,123,250,.14);
  --green:#2FBF87; --green-soft:rgba(47,191,135,.14);
  --orange:#F5A623; --orange-soft:rgba(245,166,35,.14);
  --red:#EF4444; --red-soft:rgba(239,68,68,.14);
  --yellow:#FFC107;
  --gradient-life: linear-gradient(135deg, var(--blue), var(--green));
  --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
  --font-display:'Sora', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{background:var(--bg);}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 12% -10%, rgba(62,123,250,.10), transparent 40%),
    radial-gradient(circle at 100% 0%, rgba(47,191,135,.07), transparent 35%),
    var(--bg);
  color:var(--text); min-height:100vh;
}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ---------------- LAYOUT SHELL + SIDEBAR (menm ak index.html) ---------------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
.sidebar{
  background:var(--bg-elevated);border-right:1px solid var(--border);padding:22px 14px;
  display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.2px;}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--gradient-life);display:grid;place-items:center;color:#06110C;font-weight:800;font-size:13px;box-shadow:0 4px 14px -4px rgba(62,123,250,.55);}
.nav-group{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-label{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-faint);padding:14px 12px 6px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;position:relative;transition:background .15s ease, color .15s ease;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;stroke-width:2;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--blue);}
.sidebar-foot{border-top:1px solid var(--border-soft);padding-top:14px;display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gradient-life);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#06110C;flex-shrink:0;}
.sidebar-foot .who{min-width:0;}
.sidebar-foot .who b{display:block;font-size:12.5px;font-weight:600;}
.sidebar-foot .who span{font-size:11px;color:var(--text-faint);}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
}

.main{max-width:1080px;margin:0 auto;padding:24px 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);font-size:13px;font-weight:600;}
.back-link svg{width:16px;height:16px;}
.back-link:hover{color:var(--text);}
.topbar h1{font-family:var(--font-display);font-size:22px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}

/* Hero: XP / Level / Streak */
.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:16px;}
@media (max-width:720px){.hero-grid{grid-template-columns:1fr;}}
.xp-hero{padding:22px;display:flex;align-items:center;gap:18px;}
.xp-hero .lvl-badge{width:58px;height:58px;border-radius:16px;background:var(--gradient-life);display:grid;place-items:center;color:#06110C;font-family:var(--font-mono);font-weight:800;font-size:14px;flex-shrink:0;}
.xp-hero .lvl-info{flex:1;min-width:0;}
.xp-hero .lvl-info .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.xp-hero .lvl-info .row b{color:var(--text);font-family:var(--font-mono);}
.xp-hero .bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.xp-hero .bar-fill{height:100%;border-radius:99px;background:var(--gradient-life);transition:width .4s;}

.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.stat-box{padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.stat-box .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;}
.stat-box .ic svg{width:17px;height:17px;}
.stat-box b{font-family:var(--font-mono);font-size:20px;}
.stat-box span{font-size:11.5px;color:var(--text-faint);}

/* Continue learning */
.continue-card{padding:22px;display:flex;align-items:center;gap:18px;margin-bottom:26px;flex-wrap:wrap;}
.continue-card .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 0 rgba(0,0,0,.15);}
.continue-card .ic svg{width:26px;height:26px;}
.continue-info{flex:1;min-width:200px;}
.continue-info .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);font-weight:700;margin-bottom:3px;}
.continue-info h3{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:6px;}
.continue-info .mini-progress{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;max-width:280px;}
.continue-info .mini-progress span{display:block;height:100%;border-radius:99px;}
.continue-info .pct{font-size:11px;color:var(--text-faint);margin-top:5px;}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;border:none;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s ease;}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(62,123,250,.55);}
.btn-primary:hover{filter:brightness(1.08);}

.section-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin:0 2px 12px;}

/* Course grid */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.course-card{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:relative;}
.course-card .crown{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--yellow);}
.course-card .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15);}
.course-card .ic svg{width:28px;height:28px;}
.course-card b{font-size:14px;}
.course-card .ring-bar{width:100%;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.course-card .ring-fill{height:100%;border-radius:99px;transition:width .3s;}
.course-card .meta{font-size:11px;color:var(--text-faint);}
.course-card .btn{width:100%;justify-content:center;padding:9px 12px;font-size:12.5px;}
.course-card .btn-ghost{background:var(--surface-2);color:var(--text-dim);}
.course-card .btn-ghost:hover{color:var(--text);}

@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card{animation:rise .4s ease both;}

/* =========================================================================
   MOBILE-FIRST RESPONSIVE FIXES
   ========================================================================= */
html,body{overflow-x:hidden;}
img,svg{max-width:100%;}

@media (max-width:600px){
  .main{padding:16px 12px 50px;}
  .topbar{gap:10px;margin-bottom:16px;}
  .topbar h1{font-size:17px;}
  .back-link{font-size:12px;gap:5px;}
  .back-link svg{width:14px;height:14px;}

  .hero-grid{gap:10px;margin-bottom:12px;}
  .xp-hero{padding:16px;gap:12px;}
  .xp-hero .lvl-badge{width:46px;height:46px;border-radius:13px;font-size:11px;}
  .xp-hero .lvl-info .row{font-size:11px;}

  .stat-pair{gap:10px;}
  .stat-box{padding:14px;gap:5px;}
  .stat-box .ic{width:28px;height:28px;}
  .stat-box .ic svg{width:14px;height:14px;}
  .stat-box b{font-size:17px;}
  .stat-box span{font-size:10.5px;}

  .section-label{font-size:10px;margin:0 2px 10px;}

  .continue-card{padding:16px;gap:12px;margin-bottom:20px;}
  .continue-card .ic{width:46px;height:46px;border-radius:13px;}
  .continue-card .ic svg{width:21px;height:21px;}
  .continue-info{min-width:160px;}
  .continue-info h3{font-size:14px;line-height:1.3;}
  .continue-info .mini-progress{max-width:100%;}
  .btn{padding:12px 16px;font-size:12.5px;min-height:44px;}

  .course-grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px;}
  .course-card{padding:16px 10px;gap:8px;}
  .course-card .ic{width:46px;height:46px;border-radius:14px;}
  .course-card .ic svg{width:22px;height:22px;}
  .course-card b{font-size:12.5px;line-height:1.25;word-break:break-word;}
  .course-card .meta{font-size:10px;}
  .course-card .btn{padding:11px 10px;font-size:11.5px;min-height:42px;}
}

@media (max-width:360px){
  .course-grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;}
  .xp-hero{flex-direction:column;align-items:flex-start;}
}

</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">OS</span>OSLIFE</div>
    <nav class="nav-group" id="navGroup"></nav>
    <div class="sidebar-foot">
      <div class="avatar">W</div>
      <div class="who"><b>Wilguentz</b><span>Pétion-Ville</span></div>
    </div>
  </aside>

<div class="main">
  <div class="topbar">
    <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Retounen nan OSLIFE</a>
    <h1>Aprantisaj</h1>
    <span></span>
  </div>

  <div class="hero-grid">
    <div class="card xp-hero">
      <div class="lvl-badge" id="lvlBadge">Lv.1</div>
      <div class="lvl-info">
        <div class="row"><span>XP Total</span><b id="xpLbl">0 XP</b></div>
        <div class="bar"><div class="bar-fill" id="xpBarFill" style="width:0%"></div></div>
        <div class="row" style="margin-top:8px;margin-bottom:0;"><span>Pwogrè jeneral</span><b id="overallPctLbl">0%</b></div>
      </div>
    </div>
    <div class="stat-pair">
      <div class="card stat-box">
        <div class="ic" style="background:var(--orange-soft);color:var(--orange);"><i data-lucide="flame"></i></div>
        <b id="streakLbl">0</b><span>Jou nan yon ranje</span>
      </div>
      <div class="card stat-box">
        <div class="ic" style="background:var(--red-soft);color:var(--red);"><i data-lucide="heart"></i></div>
        <b id="heartsLbl">5</b><span>Kè disponib</span>
      </div>
    </div>
  </div>

  <div class="section-label">Kontinye Aprantisaj</div>
  <div class="card continue-card" id="continueCard">
    <div class="ic" id="continueIc"><i data-lucide="graduation-cap"></i></div>
    <div class="continue-info">
      <div class="eyebrow" id="continueEyebrow">Kou</div>
      <h3 id="continueTitle">—</h3>
      <div class="mini-progress"><span id="continueBar" style="width:0%"></span></div>
      <div class="pct" id="continuePct">0% konplete</div>
    </div>
    <a class="btn btn-primary" id="continueBtn" href="#"><i data-lucide="play"></i> Kontinye</a>
  </div>

  <div class="section-label">Kou Disponib</div>
  <div class="course-grid" id="courseGrid"></div>
</div>
</div>

<script>
const ROADMAPS = [
  { id:'html', label:'HTML', icon:'file-code-2', color:'var(--orange)', levels:[
    { id:'html-1', title:'Nivo 1 — Estrikti', lessons:[
      { id:'html-1-1', title:'Baz HTML', explanation:'HTML se lang ki bay estrikti a yon paj wèb, ak tag ki make tit, paragraf, lis, elatriye.',
        example:'<!DOCTYPE html>\n<html>\n  <body>\n    <h1>Bonjou</h1>\n  </body>\n</html>',
        practice:'Ekri yon tag <p> ki di "Mwen ap aprann HTML".',
        challengeQ:'Ki tag ki make yon paragraf?', options:['<p>','<h1>','<div>','<span>'], correct:0 },
      { id:'html-1-2', title:'Lyen ak Imaj', explanation:'Tag <a> kreye lyen, tag <img> ajoute imaj ak yon atribi src.',
        example:'<a href="https://example.com">Vizite</a>\n<img src="foto.jpg" alt="Foto">',
        practice:'Ekri yon lyen ki mennen nan "https://oslife.app".',
        challengeQ:'Ki atribi ki bay chemen imaj la?', options:['href','alt','src','link'], correct:2 },
    ]},
    { id:'html-2', title:'Nivo 2 — Fòm ak Tablo', lessons:[
      { id:'html-2-1', title:'Fòm Baz', explanation:'Tag <form> ansanm ak <input> pèmèt itilizatè antre done.',
        example:'<form>\n  <input type="text" placeholder="Non">\n  <button>Voye</button>\n</form>',
        practice:'Ajoute yon <input type="email"> nan yon fòm.',
        challengeQ:'Ki tag ki kontni yon chan antre done?', options:['<input>','<field>','<entry>','<data>'], correct:0 },
      { id:'html-2-2', title:'Tablo', explanation:'Tag <table>, <tr>, <td> ansanm kreye tablo done.',
        example:'<table>\n  <tr><td>Non</td><td>Laj</td></tr>\n</table>',
        practice:'Ajoute yon dezyèm liy nan tablo egzanp la.',
        challengeQ:'Ki tag ki reprezante yon selil nan tablo?', options:['<cell>','<td>','<tc>','<row>'], correct:1 },
    ]},
  ]},
  { id:'css', label:'CSS', icon:'palette', color:'var(--blue)', levels:[
    { id:'css-1', title:'Nivo 1 — Estil Baz', lessons:[
      { id:'css-1-1', title:'Seleksyonè', explanation:'CSS itilize seleksyonè pou vize eleman HTML epi aplike estil sou yo.',
        example:'p { color: blue; font-size: 16px; }',
        practice:'Chanje koulè tit <h1> a an vèt.',
        challengeQ:'Ki pwopriyete ki chanje koulè tèks la?', options:['background','color','font','border'], correct:1 },
      { id:'css-1-2', title:'Bwat Modèl (Box Model)', explanation:'Chak eleman gen margin, border, padding, ak contenu.',
        example:'.card { padding: 16px; margin: 10px; border: 1px solid #ccc; }',
        practice:'Ajoute yon padding 20px sou yon kat.',
        challengeQ:'Ki pwopriyete ki ajoute espas anndan yon eleman?', options:['margin','padding','gap','space'], correct:1 },
    ]},
    { id:'css-2', title:'Nivo 2 — Flexbox', lessons:[
      { id:'css-2-1', title:'Entwodiksyon Flexbox', explanation:'display:flex pèmèt ou aliye eleman fasilman nan yon liy oswa kolòn.',
        example:'.row { display: flex; gap: 10px; align-items: center; }',
        practice:'Kreye yon .row ki gen 3 kat aliye youn bò kot lòt.',
        challengeQ:'Ki pwopriyete ki aktive flexbox?', options:['display:flex','flex:row','layout:flex','box:flex'], correct:0 },
      { id:'css-2-2', title:'Jistifikasyon ak Aliyman', explanation:'justify-content ak align-items kontwole pozisyon eleman anndan yon flex container.',

        practice:'Sant yon eleman ak justify-content:center.',
        challengeQ:'Ki pwopriyete ki jistifye eleman orizontalman?', options:['align-items','justify-content','text-align','flex-wrap'], correct:1 },

  ]},
  { id:'javascript', label:'JavaScript', icon:'braces', color:'var(--orange)', levels:[

        practice:'Kreye yon varyab "laj" ki gen valè 25.',

    { id:'js-2', title:'Nivo 2 — Tablo ak Objè', lessons:[

        challengeQ:'Ki senbòl ki antoure yon objè literal?', options:['[]','{}','()','<>'], correct:1 },

  ]},
  { id:'python', label:'Python', icon:'terminal', color:'var(--green)', levels:[

        challengeQ:'Ki tip done ki itilize [] nan Python?', options:['dict','tuple','list','set'], correct:2 },

  ]},
  { id:'ai', label:'AI', icon:'brain-circuit', color:'var(--blue)', levels:[

        challengeQ:'Ki branch AI ki fè machin "aprann" apati done?', options:['Machine Learning','HTML','CSS','SQL'], correct:0 },

    { id:'ai-2', title:'Nivo 2 — Modèl ak Pwomt', lessons:[

// ---- Storage (shared shape/key with the main OSLIFE app) ----
const LS_KEY = 'oslife.learning';
function loadLearning(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return Object.assign({ xp:0, hearts:5, streak:0, lastStudyDate:null, completed:[], badges:[] }, JSON.parse(raw));
  }catch(e){}
  return { xp:0, hearts:5, streak:0, lastStudyDate:null, completed:[], badges:[], lessonLog:[], startedRoadmaps:[] };
}
const learning = loadLearning();
learning.completed = learning.completed || [];
learning.startedRoadmaps = learning.startedRoadmaps || [];

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function allLessonIdsForRoadmap(r){ return r.levels.flatMap(lvl => lvl.lessons.map(l => l.id)); }
function roadmapProgress(r){
  const ids = allLessonIdsForRoadmap(r);
  const done = ids.filter(id => learning.completed.includes(id)).length;
  return { done, total: ids.length, pct: ids.length ? Math.round((done/ids.length)*100) : 0 };
}

function renderHero(){
  const level = Math.floor(learning.xp/100) + 1;
  document.getElementById('lvlBadge').textContent = 'Lv.' + level;
  document.getElementById('xpLbl').textContent = learning.xp + ' XP';
  document.getElementById('xpBarFill').style.width = (learning.xp % 100) + '%';
  document.getElementById('streakLbl').textContent = learning.streak || 0;
  document.getElementById('heartsLbl').textContent = learning.hearts ?? 5;

  const totalLessons = ROADMAPS.reduce((s,r) => s + allLessonIdsForRoadmap(r).length, 0);
  const totalDone = learning.completed.length;
  const overallPct = totalLessons ? Math.round((totalDone/totalLessons)*100) : 0;
  document.getElementById('overallPctLbl').textContent = overallPct + '%';
}

function renderContinue(){
  const started = ROADMAPS.find(r => learning.startedRoadmaps.includes(r.id));
  const active = started || ROADMAPS[0];
  const { pct } = roadmapProgress(active);
  const flat = active.levels.flatMap(lvl => lvl.lessons);
  const next = flat.find(l => !learning.completed.includes(l.id));

  document.getElementById('continueIc').style.background = 'color-mix(in srgb, ' + active.color + ' 20%, transparent)';
  document.getElementById('continueIc').style.color = active.color;
  document.getElementById('continueIc').innerHTML = '<i data-lucide="' + active.icon + '"></i>';
  document.getElementById('continueEyebrow').textContent = started ? 'Kontinye ' + active.label : 'Kòmanse yon nouvo kou';
  document.getElementById('continueTitle').textContent = next ? next.title : (active.label + ' fini');
  document.getElementById('continueBar').style.width = pct + '%';
  document.getElementById('continueBar').style.background = active.color;
  document.getElementById('continuePct').textContent = pct + '% konplete';
  document.getElementById('continueBtn').href = 'course.html?course=' + active.id;
  if (window.lucide) lucide.createIcons();
}

function renderCourseGrid(){
  const grid = document.getElementById('courseGrid');
  grid.innerHTML = '';
  ROADMAPS.forEach(r => {
    const { done, total, pct } = roadmapProgress(r);
    const el = document.createElement('div');
    el.className = 'card course-card';
    el.innerHTML = (pct === 100 ? '<i data-lucide="crown" class="crown"></i>' : '') +
      '<div class="ic" style="background:color-mix(in srgb, ' + r.color + ' 18%, transparent);color:' + r.color + '"><i data-lucide="' + r.icon + '"></i></div>' +
      '<b>' + escapeHtml(r.label) + '</b>' +
      '<div class="ring-bar"><div class="ring-fill" style="width:' + pct + '%;background:' + r.color + '"></div></div>' +
      '<span class="meta">' + done + '/' + total + ' leson · ' + pct + '%</span>' +
      '<a class="btn btn-ghost" href="course.html?course=' + r.id + '">' + (done > 0 ? 'Kontinye' : 'Kòmanse') + '</a>';
    grid.appendChild(el);
  });
  if (window.lucide) lucide.createIcons();
}

renderHero();
renderContinue();
renderCourseGrid();
