<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kou — OSLIFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
:root{
  --bg:#0B0F1A; --bg-elevated:#10141F; --surface:#141926; --surface-2:#1A2030;
  --border:#232A3B; --border-soft:#1B2130;
  --text:#EDEFF5; --text-dim:#9AA3B8; --text-faint:#5C6478;
  --blue:#3E7BFA; --blue-soft:rgba(62,123,250,.14);
  --green:#2FBF87; --green-soft:rgba(47,191,135,.14);
  --orange:#F5A623; --orange-soft:rgba(245,166,35,.14);
  --red:#EF4444; --red-soft:rgba(239,68,68,.14);
  --yellow:#FFC107;
  --gradient-life: linear-gradient(135deg, var(--blue), var(--green));
  --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
  --font-display:'Sora', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
html{background:var(--bg);}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 12% -10%, rgba(62,123,250,.10), transparent 40%),
    radial-gradient(circle at 100% 0%, rgba(47,191,135,.07), transparent 35%),
    var(--bg);
  color:var(--text); min-height:100vh;
}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);}

.main{max-width:720px;margin:0 auto;padding:20px 20px 80px;width:100%;}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);font-size:13px;font-weight:600;flex-shrink:0;}
.back-link svg{width:16px;height:16px;}
.topbar h1{font-family:var(--font-display);font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hearts-row{display:flex;gap:3px;flex-shrink:0;}
.hearts-row svg{width:16px;height:16px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
.course-hero{padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.course-hero .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;}
.course-hero .ic svg{width:22px;height:22px;}
.course-hero .info{flex:1;min-width:0;}
.course-hero .info b{font-size:15px;}
.course-hero .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;}
.course-hero .bar span{display:block;height:100%;border-radius:99px;}
.course-hero .meta{font-size:11px;color:var(--text-faint);margin-top:4px;}

.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:14px 0 4px;}
.picker-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:10.5px;font-weight:700;color:var(--text-dim);}
.picker-chip.active{border-color:var(--blue);color:var(--text);}
.picker-chip .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;}
.picker-chip .ic svg{width:15px;height:15px;}

.unit-banner{border-radius:var(--radius-md);padding:14px 18px;margin:22px 0 26px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);}
.unit-banner .unit-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.85;}
.unit-banner .unit-title{font-size:15px;font-weight:700;margin-top:2px;}

.path{display:flex;flex-direction:column;align-items:center;position:relative;padding:6px 0 10px;}
.path-node-wrap{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
.path-node-wrap:not(:last-child)::after{content:'';position:absolute;top:66px;width:6px;height:36px;background:var(--border-soft);border-radius:3px;left:50%;transform:translateX(-50%);}
.path-node-wrap.pos-l{align-self:flex-start;margin-left:14%;}
.path-node-wrap.pos-r{align-self:flex-end;margin-right:14%;}
.path-node-wrap.pos-c{align-self:center;}

.node-btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:none;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:.12s;background:var(--surface-2);color:var(--text-faint);}
.node-btn svg{width:24px;height:24px;}
.node-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
.node-btn.locked{cursor:not-allowed;box-shadow:0 6px 0 rgba(0,0,0,.08);opacity:.55;}
.node-btn.done{background:var(--green-soft);color:var(--green);box-shadow:0 6px 0 color-mix(in srgb, var(--green) 45%, transparent);}
.node-btn.current{animation:bounce 1.6s ease-in-out infinite;}
.node-label{font-size:10px;color:var(--text-dim);margin-top:6px;max-width:110px;text-align:center;line-height:1.2;font-weight:600;}
.node-label.is-locked{color:var(--text-faint);}
.node-xp{font-size:9px;color:var(--text-faint);margin-top:2px;font-family:var(--font-mono);}
.node-start-badge{position:absolute;top:-30px;background:var(--text);color:var(--surface);font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.node-start-badge::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--text);}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* Lesson Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,9,16,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-card);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-family:var(--font-display);font-size:15px;font-weight:700;}
.modal-head .xp-tag{font-family:var(--font-mono);font-size:11px;color:var(--orange);background:var(--orange-soft);padding:3px 8px;border-radius:99px;margin-left:8px;}
.icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);display:grid;place-items:center;cursor:pointer;}
.modal-body{padding:20px;}
.progress-track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:16px;}
.progress-fill{height:100%;border-radius:99px;background:var(--gradient-life);transition:width .3s;}
.lesson-section{margin-bottom:14px;}
.lesson-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;margin-bottom:6px;}
.lesson-body{font-size:13px;color:var(--text-dim);line-height:1.6;}
.lesson-body.q{font-weight:700;color:var(--text);}
.lesson-code{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--text);white-space:pre-wrap;overflow-x:auto;}
.opt{display:flex;align-items:center;gap:8px;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:13px;cursor:pointer;color:var(--text-dim);font-weight:600;margin-bottom:8px;}
.opt:hover{border-color:var(--blue);}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);}
.feedback-bar{padding:12px 16px;border-radius:12px;margin-top:8px;font-size:13px;font-weight:700;}
.feedback-bar.ok{background:var(--green-soft);color:var(--green);}
.feedback-bar.ko{background:var(--red-soft);color:var(--red);}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border-soft);}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:none;padding:12px 18px;font-size:13.5px;font-weight:700;cursor:pointer;width:100%;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}

@media (max-width:600px){
  .main{padding:14px 12px 84px;}
  .path-node-wrap.pos-l{margin-left:4%;}
  .path-node-wrap.pos-r{margin-right:4%;}
  .node-btn{width:56px;height:56px;}
  .modal-overlay{padding:0;align-items:flex-end;}
  .modal-box{max-width:100%;border-radius:20px 20px 0 0;max-height:92vh;}
}
</style>
</head>
<body>

<div class="main">
  <div class="topbar">
    <a href="learning.html" class="back-link"><i data-lucide="arrow-left"></i> Tout Kou</a>
    <h1 id="courseTitle">Kou</h1>
    <div class="hearts-row" id="heartsRow"></div>
  </div>

  <div class="card course-hero">
    <div class="ic" id="courseIc"><i data-lucide="graduation-cap"></i></div>
    <div class="info">
      <b id="courseLabel">—</b>
      <div class="bar"><span id="courseBar" style="width:0%"></span></div>
      <div class="meta" id="courseMeta">0/0 leson</div>
    </div>
  </div>

  <div class="picker-grid" id="coursePicker"></div>

  <div id="pathWrap"></div>
</div>

<div class="modal-overlay" id="lessonModalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="lessonModalTitle">Leson</h3>
      <span class="xp-tag" id="lessonXpTag">+0 XP</span>
      <button class="icon-btn" id="closeLessonModal" style="margin-left:auto"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="lessonModalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="lessonActionBtn" disabled>Reponn reponn la anvan</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   LESSON DATABASE - INCLUDING ALL 23 HTML5 UNITS
   ========================================================================= */
const courses = {
  html: {
    title: "HTML5",
    icon: "file-code-2",
    color: "var(--orange)",
    units: [
      {
        title: "1. Introduction Web & HTML",
        lessons: [{
          id: 1, title: "Entwodiksyon HTML", xp: 20,
          content: "HTML (HyperText Markup Language) se langaj de baz ki bay tout paj wèb sou entènèt estrikti yo.",
          example: "<!DOCTYPE html>\n<html>\n  <body>\n    <h1>Bonjou Mond!</h1>\n  </body>\n</html>",
          exercise: "Ki wòl prensipal HTML nan yon sit wèb?",
          quiz: { question: "Kisa HTML ye pou yon paj wèb?", options: ["Estrikti a", "Koulè yo", "Lojik la", "Baz done a"], correct: 0 },
          challenge: { instruction: "Ekri yon tit h1 ki di 'Bonjou Mond'", starterCode: "<h1></h1>", expectedResult: "<h1>Bonjou Mond</h1>" }
        }]
      },
      {
        title: "2. HTML Document Structure",
        lessons: [{
          id: 2, title: "Estrikti Dokiman", xp: 20,
          content: "Chak dokiman HTML bezwen <!DOCTYPE html>, <html>, <head> pou detay ak <body> pou kontni vizib la.",
          example: "<html>\n  <head><title>Paj Mwen</title></head>\n  <body></body>\n</html>",
          exercise: "Ki baliz ki kontni tout tèks ak imaj moun ka wè sou ekran an?",
          quiz: { question: "Ki kote kontni vizib la ale?", options: ["<head>", "<body>", "<title>", "<meta>"], correct: 1 }
        }]
      },
      {
        title: "3. Metadata and SEO",
        lessons: [{
          id: 3, title: "Metadòne ak SEO", xp: 20,
          content: "Baliz <meta> anndan <head> la bay motè rechèch tankou Google enfòmasyon sou lang, kodaj, ak deskripsyon paj la.",
          example: '<meta charset="UTF-8">\n<meta name="description" content="Kou HTML5">',
          exercise: "Ajoute yon metadòne pou defini kodaj karaktè yo an UTF-8.",
          quiz: { question: "Ki baliz ki defini tit paj la nan onglet navigatè a?", options: ["<meta>", "<head>", "<title>", "<header>"], correct: 2 }
        }]
      },
      {
        title: "4. Semantic HTML",
        lessons: [{
          id: 4, title: "HTML Semantik", xp: 25,
          content: "HTML semantik sèvi ak baliz tankou <header>, <nav>, <main>, ak <footer> pou bay chak pati nan paj la yon sans klè.",
          example: "<header>\n  <nav></nav>\n</header>\n<main></main>\n<footer></footer>",
          exercise: "Ranplase yon div ak yon baliz semantik pou aksè pi bon.",
          quiz: { question: "Ki baliz semantik ki pi bon pou pyedepaj yon sit?", options: ["<footer>", "<bottom>", "<end>", "<section>"], correct: 0 }
        }]
      },
      {
        title: "5. Div and Organization",
        lessons: [{
          id: 5, title: "Div ak Òganizasyon", xp: 20,
          content: "Baliz <div> se yon kontene jenere ki regwoupe plizyè eleman pou fasilite estil ak CSS.",
          example: '<div class="container">\n  <h2>Tit</h2>\n  <p>Tèks...</p>\n</div>',
          exercise: "Regwoupe 2 paragraf anndan yon div.",
          quiz: { question: "Kisa <div> ye?", options: ["Yon baliz semantik", "Yon kontene jenere", "Yon baliz tèks", "Yon imaj"], correct: 1 }
        }]
      },
      {
        title: "6. Titles and Paragraphs",
        lessons: [{
          id: 6, title: "Tit ak Paragraf", xp: 20,
          content: "Tit yo soti nan <h1> rive <h6> selon enpòtans yo. Paragraf yo ekri nan baliz <p>.",
          example: "<h1>Tit Prensipal</h1>\n<p>Sa se yon paragraf.</p>",
          exercise: "Ekri pi gwo tit posib nan HTML.",
          quiz: { question: "Ki baliz ki reprezante pi gwo tit la?", options: ["<h6>", "<head>", "<h1>", "<header>"], correct: 2 }
        }]
      },
      {
        title: "7. Text Formatting",
        lessons: [{
          id: 7, title: "Fòmatay Tèks", xp: 20,
          content: "Sèvi ak <strong> pou mete aksan an gra epi <em> pou mèg/italik.",
          example: "<p>Sa se yon tèks <strong>enpòtan</strong> ak <em>italik</em>.</p>",
          exercise: "Mete yon mo an gra anndan yon paragraf.",
          quiz: { question: "Ki baliz ki bay yon tèks yon aksan fò (en gra)?", options: ["<b>", "<strong>", "<i>", "<em>"], correct: 1 }
        }]
      },
      {
        title: "8. Quotes and Technical Text",
        lessons: [{
          id: 8, title: "Sitation ak Tèks Teknik", xp: 20,
          content: "Sèvi ak <blockquote> pou sitasyon long ak <code> pou montre kòd enfòmatik.",
          example: "<blockquote>Lavi a se yon aprantisaj.</blockquote>\n<code>const x = 10;</code>",
          exercise: "Montre yon liy kòd anndan yon baliz code.",
          quiz: { question: "Ki baliz ki apwopriye pou afiche yon bout kòd?", options: ["<code>", "<pre>", "<script>", "<quote>"], correct: 0 }
        }]
      },
      {
        title: "9. Links",
        lessons: [{
          id: 9, title: "Lyen Hypertexte", xp: 20,
          content: "Baliz <a> sèvi ak atribi href la pou kreye lyen ki mennen sou lòt paj.",
          example: '<a href="https://oslife.app" target="_blank">Vizite OSLIFE</a>',
          exercise: "Kreye yon lyen ki ouvè nan yon nouvo onglet.",
          quiz: { question: "Ki atribi ki bay adrès paj lyen an ap mennen an?", options: ["src", "link", "href", "url"], correct: 2 }
        }]
      },
      {
        title: "10. Images",
        lessons: [{
          id: 10, title: "Imaj ak Atribi", xp: 20,
          content: "Baliz <img> bezwen atribi src pou chemen imaj la ak alt pou deskripsyon an si imaj la pa chaje.",
          example: '<img src="foto.jpg" alt="Foto Wilguentz" width="300">',
          exercise: "Ajoute yon imaj ak atribi alt obligatwa a.",
          quiz: { question: "Kisa atribi alt la sèvi nan yon imaj?", options: ["Bay koulè", "Deskripsyon si imaj la pa parèt", "Lyen imaj la", "Chanje gwosè"], correct: 1 }
        }]
      },
      {
        title: "11. Audio and Video",
        lessons: [{
          id: 11, title: "Odyo ak Videyo", xp: 25,
          content: "HTML5 pèmèt enkòpore medya dirèkteman ak baliz <audio> ak <video> lè w sèvi ak atribi controls la.",
          example: '<video src="film.mp4" controls width="400"></video>',
          exercise: "Ajoute yon baliz video ki gen bouton kontwòl yo.",
          quiz: { question: "Ki atribi ki afiche bouton play/pause yo?", options: ["buttons", "controls", "autoplay", "media"], correct: 1 }
        }]
      },
      {
        title: "12. Lists",
        lessons: [{
          id: 12, title: "Lis Numewote ak Pwen", xp: 20,
          content: "Sèvi ak <ul> pou lis ak pwen (unordered) ak <ol> pou lis ak nimewo. Chak eleman ekri nan <li>.",
          example: "<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n</ul>",
          exercise: "Kreye yon lis ak nimewo an 3 etap.",
          quiz: { question: "Ki baliz ki reprezante chak eleman anndan yon lis?", options: ["<list>", "<li>", "<item>", "<ol>"], correct: 1 }
        }]
      },
      {
        title: "13. Tables",
        lessons: [{
          id: 13, title: "Tablo Done", xp: 25,
          content: "Tablo yo fèt ak <table>, <tr> pou liy yo, <th> pou antèt, ak <td> pou done nan selil yo.",
          example: "<table>\n  <tr><th>Non</th></tr>\n  <tr><td>Wilguentz</td></tr>\n</table>",
          exercise: "Kreye yon tablo ki gen 2 liy ak 2 kolòn.",
          quiz: { question: "Ki baliz ki kreye yon liy nan yon tablo?", options: ["<td>", "<th>", "<tr>", "<table-row>"], correct: 2 }
        }]
      },
      {
        title: "14. Forms",
        lessons: [{
          id: 14, title: "Fòm ak Antre", xp: 25,
          content: "Baliz <form> regwoupe chan pou ranmase done nan men itilizatè a.",
          example: '<form action="/submit">\n  <button type="submit">Voye</button>\n</form>',
          exercise: "Kreye yon fòm ki gen yon bouton submit.",
          quiz: { question: "Ki baliz prensipal ki antoure tout chan yon fòm?", options: ["<input>", "<form>", "<fieldset>", "<group>"], correct: 1 }
        }]
      },
      {
        title: "15. Input Types",
        lessons: [{
          id: 15, title: "Tip d'Antre (<input>)", xp: 25,
          content: "Atribi type la chanje konpòtman <input> la: text, password, email, number, checkbox, date.",
          example: '<input type="password" placeholder="Mòdpas">\n<input type="checkbox">',
          exercise: "Kreye yon chan pou rantre yon adrès email ak yon mòdpas.",
          quiz: { question: "Ki tip input ki kache karaktè yo lè w ap tape?", options: ["text", "hidden", "password", "secret"], correct: 2 }
        }]
      },
      {
        title: "16. Advanced Forms",
        lessons: [{
          id: 16, title: "Fòm Avanse", xp: 25,
          content: "Sèvi ak <select> ak <option> pou lis dewoulant, epi <textarea> pou gwo tèks long.",
          example: '<textarea rows="4"></textarea>\n<select><option>Ayiti</option></select>',
          exercise: "Kreye yon zòn tèks long ak textarea.",
          quiz: { question: "Ki baliz ki pèmèt ekri yon mesaj ki gen plizyè liy?", options: ["<input>", "<text>", "<textarea>", "<message>"], correct: 2 }
        }]
      },
      {
        title: "17. Interactive Elements",
        lessons: [{
          id: 17, title: "Eleman Interaktif", xp: 20,
          content: "Baliz <details> ak <summary> kreye yon bwat kache ki ka ouvè ak klike san bezwen JavaScript.",
          example: "<details>\n  <summary>Wè plis</summary>\n  <p>Detay kache yo...</p>\n</details>",
          exercise: "Kreye yon meni dewoulant entèaktif senp ak details.",
          quiz: { question: "Ki baliz ki anndan <details> ki sèvi kòm tit ki klibak la?", options: ["<title>", "<summary>", "<label>", "<header>"], correct: 1 }
        }]
      },
      {
        title: "18. Canvas and SVG",
        lessons: [{
          id: 18, title: "Grafik: Canvas ak SVG", xp: 30,
          content: "SVG pèmèt desine fòm vektoryèl net, pandan <canvas> sèvi pou desine ak JavaScript.",
          example: '<svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>',
          exercise: "Ekri yon etikèt SVG senp pou yon sèk.",
          quiz: { question: "Ki baliz ki sèvi pou grafik vektoryèl ki pa pèdi kalite lè w agrandi l?", options: ["<canvas>", "<svg>", "<img>", "<graphic>"], correct: 1 }
        }]
      },
      {
        title: "19. Scripts and Browser Features",
        lessons: [{
          id: 19, title: "Script ak Navigatè", xp: 20,
          content: "Baliz <script> la sèvi pou enkòpore kòd JavaScript nan paj la.",
          example: '<script src="app.js" defer><\/script>',
          exercise: "Ajoute yon script ak atribi defer la.",
          quiz: { question: "Ki baliz ki sèvi pou amene kòd JavaScript nan dokiman an?", options: ["<js>", "<script>", "<link>", "<code >"], correct: 1 }
        }]
      },
      {
        title: "20. Accessibility",
        lessons: [{
          id: 20, title: "Aksesiblite (a11y)", xp: 25,
          content: "Atribi ARIA tankou aria-label ak alt sou imaj yo pèmèt moun ki gen handikap sèvi ak sit la fasilman.",
          example: '<button aria-label="Fèmen meni an">X</button>',
          exercise: "Ajoute yon aria-label sou yon bouton ki gen yon ikòn sèlman.",
          quiz: { question: "Kisa aksesiblite reprezante nan devlopman wèb?", options: ["Fè sit la pi rapid", "Mete sit la disponib pou tout moun menm moun ak handikap", "Koulè paj la", "SEO"], correct: 1 }
        }]
      },
      {
        title: "21. Attributes and Events",

      {

      {

        lessons: [{

  },
  css: { title: "CSS", icon: "palette", color: "var(--blue)", units: [{ title: "Inite 1 — Baz", lessons: [{ id: 1, title: "Seleksyonè", xp: 20, content: "CSS itilize seleksyonè...", quiz: { question: "Ki pwopriyete ki chanje koulè?", options: ["color", "font"], correct: 0 } }] }] },
  javascript: { title: "JavaScript", icon: "braces", color: "var(--orange)", units: [{ title: "Inite 1 — Baz", lessons: [{ id: 1, title: "Varyab", xp: 20, content: "let ak const...", quiz: { question: "Ki mo kle ki pa chanje?", options: ["let", "const"], correct: 1 } }] }] },

  ai: { title: "AI", icon: "brain-circuit", color: "var(--blue)", units: [{ title: "Inite 1 — Baz", lessons: [{ id: 1, title: "Kisa AI Ye", xp: 20, content: "Machine Learning...", quiz: { question: "Ki branch ki aprann?", options: ["ML", "HTML"], correct: 0 } }] }] },
  electronics: { title: "Elektwonik", icon: "cpu", color: "var(--green)", units: [{ title: "Inite 1 — Baz", lessons: [{ id: 1, title: "Lwa Ohm", xp: 20, content: "V = I x R...", quiz: { question: "Fòmil Lwa Ohm?", options: ["V=I*R", "V=I/R"], correct: 0 } }] }] }
};

/* =========================================================================
   APP CORE LOGIC & STORAGE
   ========================================================================= */
const LS_KEY = 'oslife.learning';
function loadLearning(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return Object.assign({ xp:0, hearts:5, streak:0, completed:[], startedCourses:[] }, JSON.parse(raw));
  } catch(e){}
  return { xp:0, hearts:5, streak:0, completed:[], startedCourses:[] };
}

const learning = loadLearning();
function saveLearning(){ try { localStorage.setItem(LS_KEY, JSON.stringify(learning)); } catch(e){} }

const params = new URLSearchParams(location.search);
const courseKeys = Object.keys(courses);
let courseKey = params.get('course') || courseKeys[0];
if (!courses[courseKey]) courseKey = courseKeys[0];
const course = courses[courseKey];

if (!learning.startedCourses.includes(courseKey)){
  learning.startedCourses.unshift(courseKey);
  saveLearning();
}

function renderHearts(){
  const row = document.getElementById('heartsRow');
  row.innerHTML = '';
  for (let i=0; i<5; i++){
    const on = i < (learning.hearts ?? 5);
    row.innerHTML += `<i data-lucide="heart" style="color:${on ? 'var(--red)' : 'var(--border)'}"></i>`;
  }
  if (window.lucide) lucide.createIcons();
}

function renderHeader(){
  const allLessons = course.units.flatMap(u => u.lessons);
  const doneCount = allLessons.filter(l => learning.completed.includes(courseKey + ':' + l.id)).length;
  const pct = Math.round((doneCount / allLessons.length) * 100);

  document.getElementById('courseTitle').textContent = course.title;
  document.getElementById('courseIc').style.background = `color-mix(in srgb, ${course.color} 20%, transparent)`;
  document.getElementById('courseIc').style.color = course.color;
  document.getElementById('courseIc').innerHTML = `<i data-lucide="${course.icon}"></i>`;
  document.getElementById('courseLabel').textContent = course.title;
  document.getElementById('courseBar').style.width = pct + '%';
  document.getElementById('courseBar').style.background = course.color;
  document.getElementById('courseMeta').textContent = `${doneCount}/${allLessons.length} leson · ${pct}%`;
}

function renderPicker(){
  const wrap = document.getElementById('coursePicker');
  wrap.innerHTML = '';
  courseKeys.forEach(k => {
    const c = courses[k];
    const el = document.createElement('div');
    el.className = 'picker-chip' + (k === courseKey ? ' active' : '');
    el.innerHTML = `
      <div class="ic" style="background:color-mix(in srgb, ${c.color} 20%, transparent);color:${c.color}">
        <i data-lucide="${c.icon}"></i>
      </div>${c.title}`;
    el.addEventListener('click', () => location.href = `course.html?course=${k}`);
    wrap.appendChild(el);
  });
}

function renderPath(){
  const flat = course.units.flatMap(u => u.lessons);
  const posCycle = ['pos-c', 'pos-r', 'pos-l'];
  let globalIdx = 0;
  let html = '';
  let nextMarked = false;

  course.units.forEach(unit => {
    html += `<div class="unit-banner" style="background:${course.color}">
      <div class="unit-label">${course.title}</div>
      <div class="unit-title">${unit.title}</div>
    </div><div class="path">`;

    unit.lessons.forEach(les => {
      const key = courseKey + ':' + les.id;
      const done = learning.completed.includes(key);
      const flatIdx = flat.findIndex(x => x.id === les.id);
      const unlocked = flatIdx === 0 || learning.completed.includes(courseKey + ':' + flat[flatIdx-1].id);
      const isNext = unlocked && !done && !nextMarked;
      if (isNext) nextMarked = true;

      const pos = posCycle[globalIdx % posCycle.length];
      globalIdx++;

      html += `<div class="path-node-wrap ${pos}">
        ${isNext ? '<div class="node-start-badge">Kòmanse</div>' : ''}
        <button class="node-btn ${done?'done':''} ${unlocked?'':'locked'} ${isNext?'current':''}"
          ${unlocked ? `style="background:color-mix(in srgb, ${course.color} 20%, transparent);color:${course.color};"` : ''}
          onclick="openLesson(${les.id})" ${unlocked?'':'disabled'}>
          <i data-lucide="${done ? 'check' : (unlocked ? 'star' : 'lock')}"></i>
        </button>
        <div class="node-label ${unlocked?'':'is-locked'}">${les.title}</div>
        <div class="node-xp">+${les.xp} XP</div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('pathWrap').innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

let activeLesson = null;
let answered = false;

function openLesson(id){
  const all = course.units.flatMap(u => u.lessons);
  activeLesson = all.find(l => l.id === id);
  if (!activeLesson) return;
  answered = false;

  document.getElementById('lessonModalTitle').textContent = activeLesson.title;
  document.getElementById('lessonXpTag').textContent = '+' + activeLesson.xp + ' XP';
  
  const body = document.getElementById('lessonModalBody');
  body.innerHTML = `
    <div class="lesson-section">
      <div class="lesson-label">Esplikasyon</div>
      <div class="lesson-body">${activeLesson.content}</div>
    </div>
    ${activeLesson.example ? `
      <div class="lesson-section">
        <div class="lesson-label">Egzanp Kòd</div>
        <div class="lesson-code">${escapeHtml(activeLesson.example)}</div>
      </div>` : ''}
    <div class="lesson-section">
      <div class="lesson-label">Egzèsis</div>
      <div class="lesson-body">${activeLesson.exercise || 'Li byen epi reponn kesyon an.'}</div>
    </div>
    <div class="lesson-section">
      <div class="lesson-label">Kesyon Defi</div>
      <div class="lesson-body q" style="margin-bottom:10px;">${activeLesson.quiz.question}</div>
      <div id="opts"></div>
      <div id="feedback"></div>
    </div>
  `;

  const optsWrap = document.getElementById('opts');
  activeLesson.quiz.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'opt';
    el.textContent = opt;
    el.onclick = () => {
      if (answered) return;
      answered = true;
      const isOk = i === activeLesson.quiz.correct;
      if (!isOk) learning.hearts = Math.max(0, (learning.hearts ?? 5) - 1);
      
      optsWrap.querySelectorAll('.opt').forEach((o, idx) => {
        if (idx === activeLesson.quiz.correct) o.classList.add('correct');
        else if (idx === i) o.classList.add('wrong');
      });

      document.getElementById('feedback').innerHTML = `
        <div class="feedback-bar ${isOk?'ok':'ko'}">
          ${isOk ? 'Bravo! Repons lan kòrèk.' : 'Manke ti chota. Ou pèdi 1 kè.'}
        </div>`;
      
      saveLearning();
      renderHearts();
      const btn = document.getElementById('lessonActionBtn');
      btn.disabled = false;
      btn.textContent = isOk ? 'Kontinye' : 'Kontinye kanmenm';
    };
    optsWrap.appendChild(el);
  });

  const actionBtn = document.getElementById('lessonActionBtn');
  actionBtn.disabled = true;
  actionBtn.textContent = 'Reponn reponn la anvan';

  document.getElementById('lessonModalOverlay').classList.add('open');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('closeLessonModal').onclick = () => document.getElementById('lessonModalOverlay').classList.remove('open');
document.getElementById('lessonActionBtn').onclick = () => {
  if (!answered || !activeLesson) return;
  const key = courseKey + ':' + activeLesson.id;
  if (!learning.completed.includes(key)){
    learning.completed.push(key);
    learning.xp += activeLesson.xp;
    learning.streak = (learning.streak || 0) + 1;
    saveLearning();
  }
  document.getElementById('lessonModalOverlay').classList.remove('open');
  renderHeader();
  renderPath();
};

renderHearts();
renderHeader();
renderPicker();
renderPath();
</script>
</body>
</html>
